<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0f"><title>Episodes — TagalogDrama</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="index.html">Tagalog<span>Drama</span></a><nav><a href="index.html">Home</a><a href="catalog.html">Series</a><a href="index.html#plans">Plans</a></nav></header><main class="episodes-page"><section class="catalog-head"><p class="eyebrow">SERIES</p><h1 id="seriesTitle">Episodes</h1><p id="seriesDescription" class="muted"></p></section><div id="episodeList" class="episode-list"></div></main><script>
const data={
 'sa-likod-ng-pangako':{title:'Sa Likod ng Pangako',description:'A family romance story. Replace this placeholder with your licensed synopsis.',episodes:[['slp-01',1,'Unang Pangako','free_ad'],['slp-02',2,'Ang Simula','subscription']]},
 'mahal-kita-kahit-kailan':{title:'Mahal Kita, Kahit Kailan',description:'A romance drama placeholder for licensed content.',episodes:[['mkk-01',1,'Unang Pagkikita','free_ad'],['mkk-02',2,'Sa Puso Ko','subscription']]}
};
const id=new URLSearchParams(location.search).get('id')||'sa-likod-ng-pangako';const series=data[id]||data['sa-likod-ng-pangako'];document.getElementById('seriesTitle').textContent=series.title;document.getElementById('seriesDescription').textContent=series.description;
const progress=JSON.parse(localStorage.getItem('td-progress')||'{}');const list=document.getElementById('episodeList');list.innerHTML=series.episodes.map(e=>{const watched=progress[e[0]]||0;const premium=e[3]==='subscription';return `<article class="episode-card"><div class="episode-number">${e[1]}</div><div class="episode-copy"><h2>${e[2]}</h2><p>${premium?'🔒 Subscriber episode':'🎬 Free with rewarded ad'}${watched?` · ${watched}% watched`:''}</p><div class="episode-progress"><span style="width:${watched}%"></span></div></div><a class="primary" href="watch.html?series=${encodeURIComponent(series.title)}&episode=${e[0]}&number=${e[1]}">${premium?'Unlock & Watch':'Watch'}</a></article>`}).join('');
</script></body></html>
