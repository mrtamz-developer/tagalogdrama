<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0f"><title>Sign In — TagalogDrama</title><link rel="stylesheet" href="style.css"><style>.auth-wrap{max-width:480px;margin:60px auto;padding:24px}.auth-card{background:#15151c;border:1px solid #2a2a35;border-radius:18px;padding:28px}.auth-card label{display:block;margin:14px 0 6px}.auth-card input{width:100%;padding:13px;border-radius:10px;border:1px solid #333;background:#0f0f14;color:#fff}.auth-card button{width:100%;margin-top:18px}.auth-links{text-align:center;margin-top:18px}.auth-status{min-height:24px;margin-top:14px;color:#bbb}</style></head><body>
<header class="topbar"><a class="brand" href="index.html">Tagalog<span>Drama</span></a><nav><a href="index.html">Home</a><a href="catalog.html">Series</a></nav></header>
<main class="auth-wrap"><section class="auth-card"><p class="eyebrow">ACCOUNT</p><h1>Sign in</h1><p class="muted">Sign in to use subscriptions, rewarded-ad unlocks, and protected episode access.</p><form id="loginForm"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" required><button class="primary" type="submit">Sign In</button></form><p id="status" class="auth-status"></p><p class="auth-links">New here? <a href="signup.html">Create an account</a></p></section></main>
<script src="app-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const status=document.getElementById('status');
const cfg=window.TAGALOGDRAMA_CONFIG||{};const url=cfg.supabaseUrl||window.SUPABASE_URL;const key=cfg.supabaseAnonKey||window.SUPABASE_ANON_KEY;
if(!url||!key){status.textContent='Authentication is not configured yet.';document.getElementById('loginForm').querySelector('button').disabled=true;}
const client=url&&key?supabase.createClient(url,key):null;
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!client)return;const button=e.submitter;button.disabled=true;status.textContent='Signing in…';const {data,error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){status.textContent=error.message;button.disabled=false;return;}localStorage.setItem('tagalogdrama.token',data.session.access_token);localStorage.setItem('tagalogdrama.user',JSON.stringify({id:data.user.id,email:data.user.email}));location.assign('account.html');});
</script></body></html>
