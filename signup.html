<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0f"><title>Create Account — TagalogDrama</title><link rel="stylesheet" href="style.css"><style>.auth-wrap{max-width:480px;margin:60px auto;padding:24px}.auth-card{background:#15151c;border:1px solid #2a2a35;border-radius:18px;padding:28px}.auth-card label{display:block;margin:14px 0 6px}.auth-card input{width:100%;padding:13px;border-radius:10px;border:1px solid #333;background:#0f0f14;color:#fff}.auth-card button{width:100%;margin-top:18px}.auth-status{min-height:24px;margin-top:14px;color:#bbb}</style></head><body><header class="topbar"><a class="brand" href="index.html">Tagalog<span>Drama</span></a></header><main class="auth-wrap"><section class="auth-card"><p class="eyebrow">JOIN</p><h1>Create your account</h1><form id="signupForm"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required><button class="primary" type="submit">Create Account</button></form><p id="status" class="auth-status"></p><p>Already registered? <a href="login.html">Sign in</a></p></section></main><script src="app-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const status=document.getElementById('status'),cfg=window.TAGALOGDRAMA_CONFIG||{},url=cfg.supabaseUrl||window.SUPABASE_URL,key=cfg.supabaseAnonKey||window.SUPABASE_ANON_KEY,client=url&&key?supabase.createClient(url,key):null;if(!client)status.textContent='Authentication is not configured yet.';
document.getElementById('signupForm').addEventListener('submit',async e=>{e.preventDefault();if(!client)return;const password=document.getElementById('password').value;if(password!==document.getElementById('confirm').value){status.textContent='Passwords do not match.';return;}e.submitter.disabled=true;status.textContent='Creating account…';const {data,error}=await client.auth.signUp({email:document.getElementById('email').value.trim(),password,options:{emailRedirectTo:new URL('login.html',location.href).href}});if(error){status.textContent=error.message;e.submitter.disabled=false;return;}if(data.session){localStorage.setItem('tagalogdrama.token',data.session.access_token);localStorage.setItem('tagalogdrama.user',JSON.stringify({id:data.user.id,email:data.user.email}));location.assign('account.html');return;}status.textContent='Account created. Check your email to confirm your address, then sign in.';e.submitter.disabled=false;});
</script></body></html>
