name: Backend Tests

on:
  push:
    paths:
      - 'backend/**'
      - 'data/**'
      - '.github/workflows/backend-test.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'data/**'
      - '.github/workflows/backend-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-only-test-secret-do-not-use-in-production
      DEMO_MODE: false
      FRONTEND_ORIGIN: http://localhost:8080
      PORT: 8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install
      - name: Start API
        run: npm start > /tmp/tagalogdrama-api.log 2>&1 &
      - name: Wait for API
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://localhost:8080/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tagalogdrama-api.log
          exit 1
      - run: npm test
