<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0f"><title>Series — TagalogDrama</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="index.html">Tagalog<span>Drama</span></a><nav><a href="index.html">Home</a><a href="catalog.html">Series</a><a href="search.html">Search</a><a href="library.html">Library</a><a href="account.html">Account</a></nav></header><main class="catalog-page"><section class="catalog-head"><p class="eyebrow">TAGALOGDRAMA</p><h1>Discover Filipino Stories</h1><p class="muted">Browse the catalog and choose a series to explore its episodes.</p></section><div id="catalogGrid" class="drama-grid"></div></main><script src="app-config.js"></script><script>const catalog=[{id:'sa-likod-ng-pangako',title:'Sa Likod ng Pangako',genre:'Romance • Family',episodes:24,tag:'NEW'},{id:'mahal-kita-kahit-kailan',title:'Mahal Kita, Kahit Kailan',genre:'Romance • Drama',episodes:18,tag:'TRENDING'},{id:'ang-huling-lihim',title:'Ang Huling Lihim',genre:'Mystery • Drama',episodes:30,tag:'HOT'},{id:'bago-maghatinggabi',title:'Bago Maghatinggabi',genre:'Romance • Suspense',episodes:16,tag:'NEW'}];const grid=document.getElementById('catalogGrid');const favs=()=>JSON.parse(localStorage.getItem('tagalogdrama.favorites')||'[]');function render(){grid.innerHTML=catalog.map(d=>{const fav=favs().includes(d.id);return `<article class="card"><div class="poster"><div><small>${d.tag}</small><br><b>${d.title}</b></div></div><div class="card-body"><h3>${d.title}</h3><p>${d.genre} · ${d.episodes} episodes</p><div class="card-actions"><a class="primary" href="episodes.html?series=${encodeURIComponent(d.id)}">View Episodes</a><button class="secondary" data-fav="${d.id}">${fav?'♥ Saved':'♡ Favorite'}</button></div></div></article>`}).join('');document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{let a=favs();const id=b.dataset.fav;a=a.includes(id)?a.filter(x=>x!==id):[...a,id];localStorage.setItem('tagalogdrama.favorites',JSON.stringify(a));render()})}render();</script></body></html>
