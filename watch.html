<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0f"><title>Watch — TagalogDrama</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><a class="brand" href="index.html">Tagalog<span>Drama</span></a><nav><a href="index.html">Home</a><a href="catalog.html">Series</a><a href="search.html">Search</a><a href="library.html">Library</a><a href="account.html">Account</a></nav></header>
<main class="watch-page"><section class="player"><div class="video-placeholder"><div class="play-icon">▶</div><h1 id="title">Episode</h1><p id="playerMessage">Checking playback access…</p></div></section><section class="watch-info"><p class="eyebrow">NOW WATCHING</p><h2 id="seriesTitle">TagalogDrama</h2><p id="episodeText">Episode</p><div class="progress"><span id="progressBar"></span></div><div class="watch-actions"><button class="primary" id="freeWatch">🎬 Watch Ad to Unlock</button><button class="secondary" id="subscribeBtn">⭐ Subscribe</button><button class="secondary" id="favoriteBtn">♡ Favorite</button><a class="secondary" id="episodesLink" href="catalog.html">All Episodes</a></div><p class="note" id="accessNote">Playback is enabled only after server-side entitlement verification.</p></section></main><div class="toast" id="toast"></div>
<script src="app-config.js"></script>
<script>
const q=new URLSearchParams(location.search),series=q.get('series')||'TagalogDrama',episodeId=q.get('episode')||'',number=q.get('number')||'1';
document.getElementById('title').textContent=series+' — Episode '+number;document.getElementById('seriesTitle').textContent=series;document.getElementById('episodeText').textContent='Episode '+number;
const key='tagalogdrama.progress',progress=JSON.parse(localStorage.getItem(key)||localStorage.getItem('td-progress')||'{}');let watched=Number(progress[episodeId]||0);document.getElementById('progressBar').style.width=Math.min(watched,100)+'%';
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2800)};
let favs=JSON.parse(localStorage.getItem('tagalogdrama.favorites')||'[]');const favoriteId=(q.get('seriesId')||series.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''));const favoriteBtn=document.getElementById('favoriteBtn');const refreshFav=()=>favoriteBtn.textContent=favs.includes(favoriteId)?'♥ Saved':'♡ Favorite';refreshFav();favoriteBtn.onclick=()=>{favs=favs.includes(favoriteId)?favs.filter(x=>x!==favoriteId):[...favs,favoriteId];localStorage.setItem('tagalogdrama.favorites',JSON.stringify(favs));refreshFav()};
const seriesMap={'Sa Likod ng Pangako':'sa-likod-ng-pangako','Mahal Kita, Kahit Kailan':'mahal-kita-kahit-kailan'};document.getElementById('episodesLink').href='episodes.html?series='+encodeURIComponent(seriesMap[series]||favoriteId);
const base=window.TAGALOGDRAMA_API||'';const token=localStorage.getItem('tagalogdrama.token');
async function checkAccess(){
 if(!base||!token){document.getElementById('playerMessage').textContent='Sign in to check your episode access.';return false;}
 try{const r=await fetch(`${base}/episodes/${encodeURIComponent(episodeId)}/access`,{headers:{Authorization:`Bearer ${token}`}});const body=await r.json().catch(()=>({}));
   if(body.allowed){document.getElementById('playerMessage').textContent=`Access granted via ${body.access==='subscription'?'subscription':'rewarded ad'}.`;document.getElementById('freeWatch').style.display='none';return true;}
   document.getElementById('playerMessage').textContent=body.reason==='subscription_required'?'Subscribe to watch this episode.':'Watch a rewarded ad to unlock this episode.';return false;
 }catch{document.getElementById('playerMessage').textContent='Unable to verify access right now.';return false;}
}
async function startPlayback(){
 if(!base||!token)return toast('Please sign in first.');
 try{const r=await fetch(`${base}/episodes/${encodeURIComponent(episodeId)}/play`,{method:'POST',headers:{Authorization:`Bearer ${token}`,'content-type':'application/json'}});const body=await r.json().catch(()=>({}));if(!r.ok){toast(body.error||'Playback is not available.');return;}if(body.playbackUrl){document.querySelector('.video-placeholder').innerHTML=`<video controls playsinline style="width:100%;max-height:70vh" src="${body.playbackUrl}"></video>`;document.getElementById('playerMessage').textContent='Playback authorized.';}}
 catch{toast('Unable to reach the playback service.');}
}
async function unlock(){
 if(!base){toast('AdMob reward verification is not configured yet.');return;}
 if(!token){toast('Please sign in before watching a rewarded ad.');return;}
 toast('Open the rewarded-ad experience in the app. Access will be granted after AdMob verifies the reward.');
}
document.getElementById('freeWatch').onclick=unlock;
document.getElementById('subscribeBtn').onclick=async()=>{
 if(!base||!token){toast('Please sign in before subscribing.');return;}
 const plan=window.prompt('Choose a plan: daily, weekly, or monthly','monthly');
 if(!['daily','weekly','monthly'].includes(plan))return;
 try{const r=await fetch(`${base}/subscriptions/checkout`,{method:'POST',headers:{Authorization:`Bearer ${token}`,'content-type':'application/json'},body:JSON.stringify({plan})});const body=await r.json().catch(()=>({}));if(!r.ok){toast(body.error||'Unable to create checkout.');return;}if(body.checkoutUrl){location.href=body.checkoutUrl;return;}toast('Checkout session created.');}catch{toast('Unable to reach the payment service.');}
};
checkAccess().then(ok=>{if(ok)startPlayback();});
</script></body></html>
