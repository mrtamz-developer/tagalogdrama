<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0f"><title>Watch — TagalogDrama</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="index.html">Tagalog<span>Drama</span></a><nav><a href="index.html">Home</a><a href="catalog.html">Series</a><a href="index.html#plans">Plans</a></nav></header><main class="watch-page"><section class="player"><div class="video-placeholder"><div class="play-icon">▶</div><h1 id="title">Episode 1</h1><p id="playerMessage">Video player placeholder — connect your licensed video URL before production.</p></div></section><section class="watch-info"><p class="eyebrow">NOW WATCHING</p><h2 id="seriesTitle">TagalogDrama</h2><p id="episodeText">Episode 1</p><div class="progress"><span id="progressBar"></span></div><div class="watch-actions"><button class="primary" id="freeWatch">🎬 Watch Free With Ad</button><a class="secondary" href="index.html#plans">Unlock Unlimited</a><a class="secondary" id="episodesLink" href="catalog.html">All Episodes</a></div></section></main><div class="toast" id="toast"></div><script>
