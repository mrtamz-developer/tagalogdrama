<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0f"><title>Watch — TagalogDrama</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="index.html">Tagalog<span>Drama</span></a><nav><a href="index.html">Home</a><a href="catalog.html">Series</a><a href="search.html">Search</a><a href="library.html">Library</a><a href="account.html">Account</a></nav></header><main class="watch-page"><section class="player"><div class="video-placeholder"><div class="play-icon">▶</div><h1 id="title">Episode 1</h1><p id="playerMessage">Licensed video playback will be connected here before production.</p></div></section><section class="watch-info"><p class="eyebrow">NOW WATCHING</p><h2 id="seriesTitle">TagalogDrama</h2><p id="episodeText">Episode 1</p><div class="progress"><span id="progressBar"></span></div><div class="watch-actions"><button class="primary" id="freeWatch">🎬 Watch Free With Ad</button><button class="secondary" id="favoriteBtn">♡ Favorite</button><a class="secondary" id="episodesLink" href="catalog.html">All Episodes</a></div><p class="note">This demo does not contain copyrighted video. Connect only video you own or are licensed to distribute.</p></section></main><div class="toast" id="toast"></div><script>const q=new URLSearchParams(location.search),series=q.get('series')||q.get('title')||'TagalogDrama',episodeId=q.get('episode')||'demo-01',number=q.get('number')||'1';document.getElementById('title').textContent=series+' — Episode '+number;document.getElementById('seriesTitle').textContent=series;document.getElementById('episodeText').textContent='Episode '+number;const key='tagalogdrama.progress',progress=JSON.parse(localStorage.getItem(key)||localStorage.getItem('td-progress')||'{}');let watched=Number(progress[episodeId]||0);const bar=document.getElementById('progressBar');bar.style.width=Math.min(watched,100)+'%';const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)};const id=(q.get('seriesId')||'').toLowerCase();let favs=JSON.parse(localStorage.getItem('tagalogdrama.favorites')||'[]');const favoriteBtn=document.getElementById('favoriteBtn');const favoriteId=id||series.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');function refreshFav(){favoriteBtn.textContent=favs.includes(favoriteId)?'♥ Saved':'♡ Favorite'}refreshFav();favoriteBtn.onclick=()=>{favs=favs.includes(favoriteId)?favs.filter(x=>x!==favoriteId):[...favs,favoriteId];localStorage.setItem('tagalogdrama.favorites',JSON.stringify(favs));refreshFav()};document.getElementById('freeWatch').onclick=()=>{toast('Rewarded-ad placeholder: connect your ad SDK to unlock this episode.');watched=Math.min(100,Math.max(watched,10));progress[episodeId]=watched;localStorage.setItem(key,JSON.stringify(progress));bar.style.width=watched+'%'};const seriesMap={'Sa Likod ng Pangako':'sa-likod-ng-pangako','Mahal Kita, Kahit Kailan':'mahal-kita-kahit-kailan','Ang Huling Lihim':'ang-huling-lihim','Bago Maghatinggabi':'bago-maghatinggabi'};document.getElementById('episodesLink').href='episodes.html?series='+encodeURIComponent(seriesMap[series]||favoriteId);</script></body></html>
